# 库存管理系统 Java 后端配置
# 端口 8888(用户 8081 另有用途,2026-09-14 迁出);PG 复用 5433 的 inventory 库
server:
  port: 8888

spring:
  application:
    name: inventory-server-java
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://127.0.0.1:5433/inventory
    username: inv
    password: inv123
  # Redis(Lettuce):幂等/登出黑名单/登录锁定状态 + 权限缓存,host/port 走环境变量可覆盖
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
  jackson:
    # 契约要求:remark/location/batch 等空字段必须出现在响应 JSON 中,保持默认包含 null
    serialization:
      fail-on-empty-beans: false

mybatis-plus:
  configuration:
    # 表/列名统一小写蛇形(PG 惯例,见 db/V6),开启下划线自动映射:
    # Java camelCase 字段 <-> 数据库 snake_case 列。显式 @TableField 仍优先(审计 fill 字段用)。
    map-underscore-to-camel-case: true
  global-config:
    banner: false
  # 分页插件在 MybatisPlusConfig 中注册

# JWT:secret 走环境变量,默认开发值;2 小时过期(登出即吊销,故缩短有效期)
jwt:
  secret: ${JWT_SECRET:dev-secret-please-change-in-production-9f3a8b2c1e4d}
  expires-seconds: 7200

# 登录防爆破:连续失败次数上限与锁定时长(秒)
login:
  max-attempts: 5
  lock-seconds: 300

# 操作日志:保留天数(每天 3 点定时清理早于该天数的记录)
operation-log:
  retention-days: 180

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    # swagger-ui 挂 /docs
    path: /docs
    doc-expansion: list
    deep-linking: true

# 结构化日志:控制台输出 JSON(零新依赖,Spring Boot 3 内置;
# 自定义 logback-spring.xml 场景用 format.console 驱动 StructuredLogEncoder,而非 console.json)
logging:
  level:
    com.company.inventory: info

# 可观测性:暴露 health/info/metrics(不加 prometheus registry,无采集端)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
