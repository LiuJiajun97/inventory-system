# 库存管理系统 站点(80 端口 /inventory 子路径部署,同 IP 多项目按路径共享 80)
# 端口收敛:只开 80/443
# 说明:本文件为模板,实际部署时 location 组并入既有 80 server 块(同一 server_name,
# 避免同 IP 多个 server 块 server_name 冲突导致后加载者静默失效);server_name 替换为目标机公网 IP
server {
    listen 80;
    server_name <目标机公网IP>;

    # 前端静态(拼合后落在 /usr/share/nginx/html/inventory/)
    root /usr/share/nginx/html;

    location /inventory/assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 后端 API:剥掉 /inventory 前缀后转给 inventory-app
    # 变量式 proxy_pass + resolver:解析期不解析容器名,运行期走 docker 内置 DNS
    location /inventory/api/ {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $inventory_backend http://inventory-app:8888;
        rewrite ^/inventory/(.*)$ /$1 break;
        proxy_pass $inventory_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
        proxy_read_timeout 120s;
    }

    # SPA 路由回退:基座 /inventory(BrowserRouter basename)
    location /inventory/ {
        try_files $uri $uri/ /inventory/index.html;
    }
}
