services:
  postgres:
    image: postgres:16-alpine
    container_name: inventory-postgres
    environment:
      POSTGRES_USER: inv
      POSTGRES_PASSWORD: inv123
      POSTGRES_DB: inventory
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inv -d inventory"]
      interval: 2s
      timeout: 5s
      retries: 15
    # 数据目录用本地绑定挂载(而非命名 volume):命名 volume 在部分平台/场景下会随容器环境重建而丢失,
    # 本地目录持久化更可靠。路径请按本机环境修改(目录不存在时 Docker 会自动创建)。
    volumes:
      - D:\docker\pgdata:/var/lib/postgresql/data
