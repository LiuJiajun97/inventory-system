services:
  postgres:
    image: postgres:16-alpine
    container_name: inventory-postgres
    environment:
      POSTGRES_USER: inv
      POSTGRES_PASSWORD: inv123
      POSTGRES_DB: inventory
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inv -d inventory"]
      interval: 2s
      timeout: 5s
      retries: 15
    # 2026-09-14 起数据目录挂 D:\docker\pgdata(原命名 volume 随电脑重启丢失过一次业务数据)
    volumes:
      - D:\docker\pgdata:/var/lib/postgresql/data
